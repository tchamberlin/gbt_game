<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBT Observing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
    }

    #docs-link {
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: #666;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    #docs-link:hover {
      opacity: 1;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <a id="docs-link" href="./docs/">Dev Log</a>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
